<!DOCTYPE html>
<html class="theme-default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown Preview Export</title>
<style>

        /* ==================== Theme Variables ==================== */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f6f8fa;
            --bg-tertiary: #e1e4e8;
            --text-primary: #24292e;
            --text-secondary: #6a737d;
            --text-link: #0366d6;
            --border-primary: #dfe2e5;
            --border-secondary: #c6cbd1;
            --border-heading: #eaecef;
            --code-bg: rgba(27, 31, 35, 0.05);
            --blockquote-border: #dfe2e5;
            --table-row-alt: #f6f8fa;
            --loader-bg: #f3f3f3;
            /* Fixed height of each embedded Mermaid zoom/pan box */
            --mermaid-box-height: 60vh;
        }
        html.theme-dark {
            --bg-primary: #1e1e1e;
            --bg-secondary: #2d2d2d;
            --bg-tertiary: #3c3c3c;
            --text-primary: #d4d4d4;
            --text-secondary: #969696;
            --text-link: #4da6ff;
            --border-primary: #3c3c3c;
            --border-secondary: #505050;
            --border-heading: #3c3c3c;
            --code-bg: rgba(255, 255, 255, 0.08);
            --blockquote-border: #505050;
            --table-row-alt: #262626;
            --loader-bg: #333333;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-primary);
            background-color: var(--bg-primary);
            word-wrap: break-word;
            overflow: auto;
        }

        /* Busy indicator */
        .loader {
            border: 16px solid var(--loader-bg);
            border-top: 16px solid #3498db;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #busyIndicator {
            text-align: center;
        }
        .loader {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            margin: auto;
        }

        #previewContent {
            display: none;
        }

        #mermaidErrors {
            color: red;
            font-family: monospace;
            white-space: pre-wrap;
        }

        /* ==================== Markdown Styles ==================== */

        /* Headings */
        h1, h2, h3, h4, h5, h6 {
            margin-top: 24px;
            margin-bottom: 16px;
            font-weight: 600;
            line-height: 1.25;
        }
        h1 { font-size: 2em; padding-bottom: 0.3em; border-bottom: 1px solid var(--border-heading); }
        h2 { font-size: 1.5em; padding-bottom: 0.3em; border-bottom: 1px solid var(--border-heading); }
        h3 { font-size: 1.25em; }
        h4 { font-size: 1em; }
        h5 { font-size: 0.875em; }
        h6 { font-size: 0.85em; color: var(--text-secondary); }

        /* Paragraphs */
        p {
            margin-top: 0;
            margin-bottom: 16px;
        }

        /* Links */
        a {
            color: var(--text-link);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }

        /* Lists */
        ul, ol {
            padding-left: 2em;
            margin-top: 0;
            margin-bottom: 16px;
        }
        li + li {
            margin-top: 0.25em;
        }

        /* Code - inline */
        code {
            padding: 0.2em 0.4em;
            margin: 0;
            font-size: 85%;
            background-color: var(--code-bg);
            border-radius: 3px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }

        /* Code - block */
        pre {
            padding: 16px;
            overflow: auto;
            font-size: 85%;
            line-height: 1.45;
            background-color: var(--bg-secondary);
            border-radius: 3px;
            margin-top: 0;
            margin-bottom: 16px;
        }
        pre code {
            display: block;
            padding: 0;
            margin: 0;
            overflow: visible;
            line-height: inherit;
            word-wrap: normal;
            background-color: transparent;
            border: 0;
        }

        /* Blockquotes */
        blockquote {
            margin: 0 0 16px 0;
            padding: 0 1em;
            color: var(--text-secondary);
            border-left: 0.25em solid var(--blockquote-border);
        }

        /* Tables */
        table {
            border-spacing: 0;
            border-collapse: collapse;
            margin-top: 0;
            margin-bottom: 16px;
            display: block;
            width: max-content;
            max-width: 100%;
            overflow: auto;
        }
        table th, table td {
            padding: 6px 13px;
            border: 1px solid var(--border-primary);
        }
        table th {
            font-weight: 600;
            background-color: var(--bg-secondary);
        }
        table tr {
            background-color: var(--bg-primary);
            border-top: 1px solid var(--border-secondary);
        }
        table tr:nth-child(2n) {
            background-color: var(--table-row-alt);
        }

        /* Horizontal rule */
        hr {
            height: 0.25em;
            padding: 0;
            margin: 24px 0;
            background-color: var(--bg-tertiary);
            border: 0;
        }

        /* Images */
        img {
            max-width: 100%;
            box-sizing: border-box;
        }

        /* Task lists */
        .task-list-item {
            list-style-type: none;
        }
        .task-list-item input[type="checkbox"] {
            margin-right: 0.5em;
        }

        /* Mermaid diagram boxes: fixed-height viewport with independent pan/zoom.
           The box width follows the page; zoom/pan act only on the SVG inside. */
        .mermaid-container {
            margin: 16px 0;
            display: block;
        }
        .mermaid-box {
            position: relative;
            width: 100%;
            height: var(--mermaid-box-height);
            overflow: hidden;
            border: 1px solid var(--border-primary);
            border-radius: 4px;
            background-color: var(--bg-primary);
            box-sizing: border-box;
        }
        .mermaid-box svg {
            display: block;
            width: 100%;
            height: 100%;
            max-width: none !important;  /* Override Mermaid's inline max-width cap */
            cursor: grab;
            touch-action: none;
        }
        .mermaid-box svg:active {
            cursor: grabbing;
        }

        /* Per-box toolbar overlay (zoom in / out / fit-width) */
        .mermaid-toolbar {
            position: absolute;
            top: 6px;
            right: 6px;
            display: flex;
            gap: 4px;
            opacity: 0.55;
            transition: opacity 0.15s ease;
            z-index: 5;
        }
        .mermaid-box:hover .mermaid-toolbar {
            opacity: 1;
        }
        .mermaid-toolbar button {
            width: 26px;
            height: 26px;
            padding: 0;
            line-height: 1;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .mermaid-toolbar button:hover {
            background-color: var(--bg-tertiary);
        }

        /* ==================== Theme Variants ==================== */
        .theme-default {
            background-color: #fff;
            color: #24292e;
        }
        .theme-dark {
            background-color: #2A303C;
            color: #c9d1d9;
        }
        .theme-dark h1, .theme-dark h2 {
            border-bottom-color: #30363d;
        }
        .theme-dark a {
            color: #58a6ff;
        }
        .theme-dark code {
            background-color: rgba(110, 118, 129, 0.2);
        }
        .theme-dark pre {
            background-color: #161b22;
        }
        .theme-dark blockquote {
            color: #8b949e;
            border-left-color: #30363d;
        }
        .theme-dark table th, .theme-dark table td {
            border-color: #30363d;
        }
        .theme-dark table th {
            background-color: #161b22;
        }
        .theme-dark table tr {
            background-color: #0d1117;
            border-top-color: #30363d;
        }
        .theme-dark table tr:nth-child(2n) {
            background-color: #161b22;
        }
        .theme-dark hr {
            background-color: #30363d;
        }

        .theme-neutral {
            background-color: #FDFDFD;
            color: #333;
        }
        .theme-forest {
            background-color: #FAF7F5;
            color: #333;
        }
    
</style>
</head>
